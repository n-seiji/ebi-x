[tools]
go = "1.27.3"
node = "latest"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build ebi-x binary"
# On macOS, the hardened runtime keeps debuggers, and so the commands Codex
# runs, from attaching to ebi-x and reading the keys it holds in memory.
run = """
go build -o ebi-x ./cmd/ebi-x
if [ "$(uname)" = Darwin ]; then codesign --force --sign - --options runtime ebi-x; fi
"""

[tasks.run]
description = "Build and run ebi-x"
depends = ["build"]
run = "./ebi-x"

[tasks.reload]
description = "Rebuild ebi-x and restart the running one once its work is done"
depends = ["build"]
run = 'kill -HUP "$(cat "${EBIX_HOME:-.}/data/state/ebi-x.lock")"'

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run go vet and gofmt check"
run = """
go vet ./...
test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files need formatting"; exit 1; }
"""
